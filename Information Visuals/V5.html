
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Colorblind Friendly Network Graph</title>

    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: white;
        }

        svg {
            display: block;
            margin: auto;
        }

        .node text {
            font-size: 14px;
            fill: #333;
            pointer-events: none;
        }

        .link {
            stroke-opacity: 0.4;
        }

        .node circle {
            stroke: #333;
            stroke-width: 2px;
        }
    </style>
</head>

<body>

<svg width="900" height="750"></svg>

<script>

"use strict";

// ------------------------------------
// SVG
// ------------------------------------

var svg = d3.select("svg");

var width = 900;
var height = 750;


// ------------------------------------
// COLORBLIND-FRIENDLY COLORS
// Okabe-Ito inspired palette
// ------------------------------------

var colors = {
    blue: "#0072B2",
    orange: "#E69F00",
    green: "#009E73",
    vermillion: "#D55E00",
    purple: "#CC79A7"
};


// ------------------------------------
// DATA
// ------------------------------------

var nodes = [

    { id: "APOD", type: "main", size: 55 },
    { id: "MUC16", type: "main", size: 45 },
    { id: "ELOVL5", type: "secondary", size: 38 },

    { id: "Inc-LIPI-4:1", type: "green", size: 28 },
    { id: "Inc-DDR2-1:1", type: "secondary", size: 30 },
    { id: "NONHSAT173593", type: "secondary", size: 25 },
    { id: "NONHSAT163250", type: "secondary", size: 30 },

    { id: "Inc-CLLU1.1-2:2", type: "secondary", size: 27 },
    { id: "Inc-IFRD2-3:1", type: "secondary", size: 27 },
    { id: "SFRP1", type: "secondary", size: 27 },

    { id: "Inc-RP11-33N16.1.1-3:2", type: "secondary", size: 27 },
    { id: "Inc-SCP2-2:1", type: "secondary", size: 34 },

    { id: "SLC4A4", type: "secondary", size: 22 },
    { id: "SLC9A7", type: "secondary", size: 34 },

    { id: "Inc-DYNL2-4:1", type: "secondary", size: 25 },
    { id: "GNAZ", type: "green", size: 34 },

    { id: "NONHSAT159135", type: "green", size: 28 },
    { id: "NONHSAT212467", type: "green", size: 28 },

    { id: "ATP1A1", type: "secondary", size: 32 },
    { id: "CCND2", type: "secondary", size: 32 },

    { id: "Inc-CLP1-2:2", type: "secondary", size: 27 },

    { id: "EPDK1", type: "green", size: 25 },
    { id: "PAPPA", type: "green", size: 25 }
];


// ------------------------------------
// CONNECTIONS
// ------------------------------------

var links = [

    { source: "APOD", target: "MUC16" },
    { source: "APOD", target: "SFRP1" },
    { source: "APOD", target: "Inc-LIPI-4:1" },
    { source: "APOD", target: "Inc-RP11-33N16.1.1-3:2" },

    { source: "APOD", target: "Inc-SCP2-2:1" },
    { source: "APOD", target: "SLC4A4" },
    { source: "APOD", target: "SLC9A7" },

    { source: "APOD", target: "Inc-DYNL2-4:1" },
    { source: "APOD", target: "GNAZ" },

    { source: "APOD", target: "NONHSAT159135" },
    { source: "APOD", target: "ATP1A1" },

    { source: "APOD", target: "CCND2" },

    { source: "MUC16", target: "Inc-LIPI-4:1" },
    { source: "MUC16", target: "Inc-DDR2-1:1" },
    { source: "MUC16", target: "NONHSAT173593" },

    { source: "MUC16", target: "NONHSAT163250" },
    { source: "MUC16", target: "Inc-CLLU1.1-2:2" },

    { source: "MUC16", target: "Inc-IFRD2-3:1" },
    { source: "MUC16", target: "NONHSAT212467" },

    { source: "MUC16", target: "ELOVL5" },

    { source: "ELOVL5", target: "Inc-IFRD2-3:1" },
    { source: "ELOVL5", target: "EPDK1" },
    { source: "ELOVL5", target: "ATP1A1" },

    { source: "ELOVL5", target: "CCND2" },

    { source: "NONHSAT212467", target: "ATP1A1" },

    { source: "CCND2", target: "Inc-CLP1-2:2" },

    { source: "GNAZ", target: "NONHSAT159135" }
];


// ------------------------------------
// LINK COLOR
// ------------------------------------

var linkColor = d3.scaleOrdinal()
    .domain(["connection1", "connection2"])
    .range([
        colors.blue,
        colors.orange,
        colors.green,
        colors.vermillion
    ]);


// ------------------------------------
// FORCE SIMULATION
// ------------------------------------

var simulation = d3.forceSimulation(nodes)

    .force(
        "link",
        d3.forceLink(links)
            .id(function(d) {
                return d.id;
            })
            .distance(120)
    )

    .force(
        "charge",
        d3.forceManyBody()
            .strength(-500)
    )

    .force(
        "center",
        d3.forceCenter(width / 2, height / 2)
    )

    .force(
        "collision",
        d3.forceCollide()
            .radius(function(d) {
                return d.size + 15;
            })
    );


// ------------------------------------
// DRAW LINKS
// ------------------------------------

var link = svg.selectAll(".link")
    .data(links)
    .enter()
    .append("line")
    .attr("class", "link")

    // Makes the connections less overpowering
    .attr("stroke", function(d, i) {
        return i % 2 === 0
            ? colors.blue
            : colors.orange;
    })

    .attr("stroke-width", 2)

    // Transparency makes nodes easier to see
    .attr("stroke-opacity", 0.4);


// ------------------------------------
// DRAW NODES
// ------------------------------------

var node = svg.selectAll(".node")
    .data(nodes)
    .enter()
    .append("g")
    .attr("class", "node");


// ------------------------------------
// NODE CIRCLES
// ------------------------------------

node.append("circle")

    // Larger nodes are easier to distinguish
    .attr("r", function(d) {
        return d.size;
    })

    // Colorblind-friendly colors
    .attr("fill", function(d) {

        if (d.type === "main") {
            return colors.blue;
        }
        if (d.type === "green") {
        return colors.green;
    }

        return colors.orange;
    })

    // Dark border separates nodes from edges
    .attr("stroke", "#333")

    .attr("stroke-width", function(d) {

        if (d.type === "main") {
            return 3;
        }

        return 2;
    });


// ------------------------------------
// NODE LABELS
// ------------------------------------

node.append("text")

    .attr("text-anchor", "middle")

    .attr("dy", 5)

    .text(function(d) {
        return d.id;
    })

    .style("font-size", function(d) {

        if (d.type === "main") {
            return "17px";
        }

        return "13px";
    })

    .style("font-weight", function(d) {

        if (d.type === "main") {
            return "bold";
        }

        return "normal";
    });


// ------------------------------------
// SIMULATION UPDATE
// ------------------------------------

simulation.on("tick", function() {

    link

        .attr("x1", function(d) {
            return d.source.x;
        })

        .attr("y1", function(d) {
            return d.source.y;
        })

        .attr("x2", function(d) {
            return d.target.x;
        })

        .attr("y2", function(d) {
            return d.target.y;
        });


    node

        .attr("transform", function(d) {

            return "translate(" +
                d.x + "," +
                d.y +
                ")";

        });

});


// ------------------------------------
// DRAGGING
// ------------------------------------

node.call(

    d3.drag()

        .on("start", function(event, d) {

            if (!event.active) {
                simulation.alphaTarget(0.3).restart();
            }

            d.fx = d.x;
            d.fy = d.y;

        })

        .on("drag", function(event, d) {

            d.fx = event.x;
            d.fy = event.y;

        })

        .on("end", function(event, d) {

            if (!event.active) {
                simulation.alphaTarget(0);
            }

            d.fx = null;
            d.fy = null;

        })

);

</script>

</body>
</html>
