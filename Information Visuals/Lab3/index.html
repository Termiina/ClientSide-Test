<!DOCTYPE html>

<head>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script type="module" src="./main.js"></script>
    
</head>

<html>


<body>


    <h2>1. Create an SVG Circle</h2>


    <svg width="200" height="150">
        <circle cx="75" cy="75" r="50" fill="blue"></circle>
    </svg>




    <h2>2. Five Circles Stacked Vertically</h2>


    <svg width="200" height="500">
        <circle class="myCircles" cx="75" cy="50" r="30" fill="red"></circle>
        <circle class="myCircles" cx="75" cy="130" r="30" fill="orange"></circle>
        <circle class="myCircles" cx="75" cy="210" r="30" fill="yellow"></circle>
        <circle class="myCircles" cx="75" cy="290" r="30" fill="green"></circle>
        <circle class="myCircles" cx="75" cy="370" r="30" fill="blue"></circle>
    </svg>




    <h2>3. Five Rectangles Stacked Horizontally</h2>


    <svg width="600" height="150">
        <rect x="10" y="30" width="80" height="80" fill="red"></rect>
        <rect x="120" y="30" width="80" height="80" fill="orange"></rect>
        <rect x="230" y="30" width="80" height="80" fill="yellow"></rect>
        <rect x="340" y="30" width="80" height="80" fill="green"></rect>
        <rect x="450" y="30" width="80" height="80" fill="blue"></rect>
    </svg>




    <h2>4. Five SVG Elements with Different Shapes and Colors</h2>


    <svg width="600" height="200">

        <circle cx="60" cy="80" r="40" fill="red"></circle>


        <rect x="120" y="40" width="80" height="80" fill="blue"></rect>


        <polygon points="270,30 220,120 320,120" fill="green"></polygon>

        <ellipse cx="400" cy="80" rx="60" ry="35" fill="orange"></ellipse>


        <line x1="500" y1="30" x2="500" y2="130" stroke="purple" stroke-width="15"></line>


    </svg>


</body>

</html>
